</style></head><body><main><header><div class="eyebrow">HANK WORK LAB / WORK 16 / V1.0 · 2026.10.17</div><h1>先把工作写清楚，<br>再讨论 AI 怎么参与。</h1><p>选择一个具体任务，完成研究档案、逐项评估与协作试验记录。缺少资料写“待验证”。</p><div class="online-links"><a href="https://hankjun.github.io/hank-portfolio/#shop">返回汉克小铺</a> · <a href="https://hankjun.github.io/hank-portfolio/work16/">在线阅读 WORK 16</a></div></header>

<footer>来源：WORK 16 公开书稿附录 A–C。公开试用版，可用于个人学习与团队内部讨论。评估项不相加、不输出自动化指数。</footer></main><script>
const sections=[["01", "工作研究档案", [["record", "档案编号与版本", "例如 WORK16-Opswork-2026-001 / V0.1"], ["identity", "工作类别、场景与研究日期", "写明 Work 类别、行业、任务和日期"], ["goal", "谁需要什么结果，为什么现在需要", "使用业务方的语言，避免只写“提高效率”"], ["workflow", "输入 → 步骤 → 判断 → 输出", "列出前置条件、交接点和最终交付物"], ["people", "参与角色与责任", "谁提供资料、谁执行、谁审核、谁承担最后决定"], ["tools", "数据来源、工具与权限", "哪些来源可信，账号能访问什么"], ["exceptions", "例外、错误与升级", "缺资料、数据冲突或工具失败时怎样处理"], ["baseline", "现有人工基线", "工时、质量、费用、样本、日期与来源；无数据写待测"], ["standard", "验收标准", "具体到可观察的文件、内容、格式与通过条件"], ["hypothesis", "试点假设与不做的事", "写出预期改善、需保留人工的步骤、停止条件"], ["evidence", "事实 / 假设 / 未决问题", "三类分别列出，附来源和核验日期"], ["next", "下一次验证", "负责人、下一步、日期与需补资料"]]], ["02", "任务与交付评估", [["task", "本次只评估哪一个任务", "明确最小范围，例如从项目表到一份内部周报草稿"], ["priority", "研究优先级与理由", "分别判断可行性、错误代价、维护成本，不把分数简单相加"], ["configuration", "人、软件与智能体的分工", "资料准备、执行、复核、发布分别由谁完成"]]], ["03", "AI 协作试验记录", [["experiment", "试验编号、样本与周期", "写明真实/匿名/公开资料/模拟，以及开始结束日期"], ["comparison", "旧流程与对照办法", "相同输入、相同验收规则，记录人工和协作流程差异"], ["intervention", "介入方案与复现材料", "工具版本、指令、输入样本、权限和人工复核点"], ["measure", "指标与观察结果", "分母、单位、样本、周期、原始来源，缺失值不补造"], ["incidents", "异常、返工与负面影响", "记录漏项、错误和人工接管；不要只留成功样本"], ["finding", "结论与证据等级", "观察/合理推断/有对照的因果判断，说明不能证明什么"], ["decision", "下一步决定与停止条件", "继续小试、调整、暂停或停止；负责人和日期"]]]],dimensions=[["frequency", "频次", "重复程度高，不等于可以自动化"], ["rules", "规则清晰", "输入、步骤和验收是否清楚"], ["data", "数据可得", "合法、及时、完整的数据是否可用"], ["cost", "错误代价", "高分意味着错误后果更严重"], ["irreversible", "不可逆性", "高分意味着更需要人工确认"], ["interfaces", "接口复杂度", "涉及多少系统、角色与交接"], ["judgment", "人类判断", "高分意味着应保留人的主责"], ["testable", "交付可测", "结果能否被独立核验"], ["demand", "付费意愿", "需真实交易证据；未知可留空"], ["maintenance", "维护成本", "高分意味着持续维护工作更多"]],exampleText="# 周报整理：完整模拟示例\n\n**全部任务、人物与数字为教学模拟，不是客户项目、实测或经营成果。**\n\n## 01 工作研究档案\n\n### 档案编号与版本\n\nWORK16-Opswork-DEMO-001 / V1.0（模拟）\n\n### 工作类别、场景与研究日期\n\nOpswork / 小团队内部周报整理 / 2026-10-17（模拟日期）\n\n### 谁需要什么结果，为什么现在需要\n\n项目负责人每周需要一份可追溯的进度草稿，方便核对逾期事项和责任人。\n\n### 输入 → 步骤 → 判断 → 输出\n\n输入：已确认的项目状态表 → 检查必填字段 → 按项目整理变化 → 列出待确认项 → 输出内部周报草稿。发送由负责人完成。\n\n### 参与角色与责任\n\n成员更新状态；助理整理草稿；项目负责人核对并决定是否发送。\n\n### 数据来源、工具与权限\n\n仅使用虚构项目表。试点账号只读取该表，不访问邮箱，也不发消息。\n\n### 例外、错误与升级\n\n缺负责人或日期：标记待确认；数据冲突：列出原值和来源；执行失败：保留原表，改用人工整理。\n\n### 现有人工基线\n\n教学用假设：人工 40 分钟；AI 协作 28 分钟（含人工检查）。只有 1 份模拟输入，未做真实测量。\n\n### 验收标准\n\n三个项目均有状态、负责人、日期和来源行；未知项不补写；无未经确认的完成结论；只生成草稿。\n\n### 试点假设与不做的事\n\n假设整理时间可能缩短，同时不增加事实错误。保留人工核对与发送；出现越权访问或无法定位来源即停止。\n\n### 事实 / 假设 / 未决问题\n\n事实：示例是人工编写的模拟数据。假设：真实流程可能节时。未决：真实资料缺失率、工具成本与持续维护时间。\n\n### 下一次验证\n\n负责人在取得可用样本后安排小规模真实试验，记录质量和检查成本；具体日期待定。\n\n## 02 任务与交付评估\n\n### 本次只评估哪一个任务\n\n把三个虚构项目整理为一份内部周报草稿；不包括发送或修改项目状态。\n\n### 研究优先级与理由\n\n可先小试：文本任务和验收规则较清楚；付费意愿、真实效率和维护成本均未验证。评分仅用于比较讨论。\n\n### 人、软件与智能体的分工\n\n人确认输入 → 智能体提炼变化并标来源 → 人逐项核对 → 人决定是否发布。\n\n### 逐项评估（模拟）\n\n- 频次：4 / 5；重复程度高，不等于可以自动化。\n- 规则清晰：4 / 5；输入、步骤和验收是否清楚。\n- 数据可得：3 / 5；合法、及时、完整的数据是否可用。\n- 错误代价：3 / 5；高分意味着错误后果更严重。\n- 不可逆性：2 / 5；高分意味着更需要人工确认。\n- 接口复杂度：2 / 5；涉及多少系统、角色与交接。\n- 人类判断：3 / 5；高分意味着应保留人的主责。\n- 交付可测：4 / 5；结果能否被独立核验。\n- 付费意愿：待验证；需真实交易证据；未知可留空。\n- 维护成本：待验证；高分意味着持续维护工作更多。\n\n分数仅为演示，未累加。\n\n## 03 AI 协作试验记录\n\n### 试验编号、样本与周期\n\nDEMO-001；模拟；1 份含 3 个虚构项目的输入；不对应真实客户或真实观察。\n\n### 旧流程与对照办法\n\n演示如何在同一份输入和相同验收表下记录人工与协作流程；本示例没有开展实际对照。\n\n### 介入方案与复现材料\n\n示例指令：仅按状态表整理周报。保留项目名、负责人、日期和来源行。缺失写“待确认”，不要发送或更新系统。实际工具和版本需在真实试验时记录。\n\n### 指标与观察结果\n\n假设数字：40 → 28 分钟，差值 12 分钟；(40-28)/40=30%。三项目覆盖：3/3；1 项缺失日期保留待确认。全部为模拟数字，不能作为成效证据。\n\n### 异常、返工与负面影响\n\n虚构项目 C 缺日期，草稿保留待确认；如模型自行补日期，该次结果判为不通过并记录返工时间。\n\n### 结论与证据等级\n\n等级：教学演示。只能说明如何记录，不能证明节时 30%、降低成本、提高质量或具有因果效果。\n\n### 下一步决定与停止条件\n\n先补真实基线与样本，再决定是否继续；任何越权、泄露或不可追溯输出触发暂停。\n\n";
const form=document.getElementById('practiceForm'),status=document.getElementById('saveStatus');
const key='hank-work16-practice-v1';
function field(id,label,hint){const wrap=document.createElement('label');wrap.className='field';const strong=document.createElement('strong');strong.textContent=label;const small=document.createElement('small');small.textContent=hint;const input=document.createElement('textarea');input.name=id;input.id=id;wrap.append(strong,small,input);return wrap;}
for(const [num,title,fields] of sections){const section=document.createElement('section');section.id={"01":"recordSection","02":"assessmentSection","03":"experimentSection"}[num];const caption=document.createElement('div');caption.className='eyebrow';caption.textContent='STEP / '+num;const heading=document.createElement('h2');heading.textContent=title;section.append(caption,heading);for(const [id,label,hint] of fields)section.append(field(id,label,hint));if(num==='02'){const note=document.createElement('p');note.textContent='逐项填 1–5 分或留空。高分含义依维度而异；没有证据就写待验证，不计算总分。';section.append(note);const matrix=document.createElement('div');matrix.className='matrix';for(const [id,label,hint] of dimensions){const article=document.createElement('article');const h=document.createElement('h3');h.textContent=label;const p=document.createElement('p');p.textContent=hint;const scoreLabel=document.createElement('label');scoreLabel.textContent=label+'评分（1–5，可留空）';const input=document.createElement('input');input.type='number';input.min='1';input.max='5';input.step='1';input.name='score_'+id;input.setAttribute('aria-label',label+'评分');scoreLabel.append(input);article.append(h,p,scoreLabel,field('reason_'+id,'证据与未决问题','写来源、观察与待验证内容'));matrix.append(article);}section.append(matrix);}form.append(section);}
document.getElementById('exampleContent').textContent=exampleText;
function values(){return Object.fromEntries(new FormData(form));}
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&saved.values){for(const el of form.elements)if(el.name&&typeof saved.values[el.name]==='string')el.value=saved.values[el.name];status.textContent='已恢复本浏览器的练习记录。请及时导出备份。';}}catch{status.textContent='本浏览器存储不可用；可以填写后直接导出。';}
function save(){try{localStorage.setItem(key,JSON.stringify({version:1,updatedAt:new Date().toISOString(),values:values()}));status.textContent='已保存到本浏览器。建议同时导出 Markdown 备份。';return true;}catch{status.textContent='浏览器未允许本地保存，请使用导出 Markdown。';return false;}}
form.addEventListener('submit',event=>event.preventDefault());document.getElementById('saveButton').addEventListener('click',()=>{if(form.reportValidity())save();});
document.getElementById('exportButton').addEventListener('click',()=>{if(!form.reportValidity())return;const v=values(),lines=['# WORK 16 工作诊断与 AI 协作练习记录','','来源：HANK WORK LAB / V1.0','导出日期：'+new Date().toLocaleDateString('zh-CN'),''];for(const [num,title,fields] of sections){lines.push('## '+num+' '+title,'');for(const [id,label] of fields)lines.push('### '+label,'',v[id]||'（未填写）','');if(num==='02')for(const [id,label,hint] of dimensions)lines.push('### '+label,'','评分：'+(v['score_'+id]||'未评估'),'评分方向：'+hint,'证据：'+(v['reason_'+id]||'待验证'),'');}lines.push('各维度不合计；结论仅以本记录中的样本和证据为限。');const blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/markdown;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='WORK16-我的工作诊断.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status.textContent='已生成 Markdown 下载；请检查下载文件已保存。';});
document.getElementById('printButton').addEventListener('click',()=>{if(form.reportValidity())window.print();});
window.addEventListener('beforeprint',()=>{for(const el of form.querySelectorAll('textarea')){el.style.height='auto';el.style.height=(el.scrollHeight+12)+'px';}});
</script></body></html>
