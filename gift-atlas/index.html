['商务往来','客户拜访伴手礼','客户','150–300','tea','在一次正式会面后，为双方留下恰当的记忆。','拜访前由对接人确认收礼惯例与人数。初次见面宜选轻便、可分享的组合。','小罐茶搭配产地卡，或独立包装的地方点心。品牌标识放在可取下的腰封上。','先确认对方内部礼品政策，再核对行程、手提尺寸和食品忌口。'],
['组织关怀','新员工入职礼','员工','80–150','desk','让新同事在第一天就找到归属感和工作入口。','办公地、岗位与入职批次影响礼物的实际用处。可先访谈近期入职的同事。','工位笔记本、姓名卡与一张团队地图组合，地图注明入职首周常用联系人。','核对姓名与到岗日期，远程员工提前寄送，预留补寄库存。'],
['节庆人情','中秋团圆礼','亲友','150–300','festival','围绕家庭分享与团聚，设计一份节日问候。','先了解家庭人数、口味与探访时间，再决定食品规格和份数。','小份混合口味月饼搭配茶样，附一张可手写的问候卡。','按到货日期倒排寄送，核对保质期、过敏原与外盒抗压性。'],
['商务往来','展会交流礼','客户','30–80','desk','用一件方便带走的小物，延续展位上的谈话。','区分路过观众和已预约客户，观察他们的行李空间与停留时间。','用薄型笔记本配应用案例卡，按交流主题放入不同资料页。','按场次分箱，留意现场领取速度，记录后续咨询来自哪类资料。'],
['组织关怀','员工周年礼','员工','150–300','hero','把服务年限转化为看得见的个人记忆。','先确认员工愿意公开纪念还是私下领取，整理本人认可的项目记忆。','定制姓名纪念卡搭配可自选的日用品，主管手写一条具体的感谢。','打样核对工龄、姓名与纪念日期，给自选礼品设置兑换期限提醒。'],
['节庆人情','新年探亲礼','亲友','150–300','tea','为一次家庭拜访准备能一起打开的礼物。','确认谁会一起用餐、是否长途携带，了解长辈习惯的口味。','茶与小份干果分别密封，注明配料，选用可再次收纳的外盒。','先确认是否有人对坚果过敏，再决定组合和替换项。'],
['文化文旅','城市伴手礼','游客','30–80','festival','让游客把一段地方体验带回日常生活。','追问游客记住了哪个地点、哪道风味，区分自留与分送需求。','以街区图案做纸品套装，附短篇地方故事和路线索引。','校对地名与图案授权，做行李挤压测试，分送款采用独立小封套。'],
['文化文旅','馆藏新年日历','游客','80–150','desk','把博物馆参访延伸到来年的书桌上。','区分艺术爱好者、家庭与海外访客，确认阅读语言和陈列空间。','以馆藏主题组织图像与短注，设计可翻阅样张，方便现场选购。','确认图像授权与文字审校流程，先测试翻页、支撑与跨年库存。'],
['商务往来','项目结项答谢','客户','80–150','hero','用共同完成的项目细节表达感谢。','梳理参与岗位和共同节点，确认可公开的项目内容。','把项目里程碑做成折页，与适合团队分享的点心一起交付。','项目双方确认名称与图片授权，按参与人数拆分。']

      context.strokeStyle=g.color+(visible&&hasMatch?'69':'18');
      context.beginPath();context.moveTo(cx,cy);context.quadraticCurveTo((cx+x)/2+18,(cy+y)/2-32,x,y);context.stroke();
      position(g.button,x,y,visible&&hasMatch?1:.35,true);
      g.stars.forEach(star=>{
        const base=Math.min(width,height)*star.distance*scale;
        const sx=x+Math.cos(star.angle)*base,sy=y+Math.sin(star.angle)*base*.84;
        const shown=visible&&matches(star.id);
        context.strokeStyle=g.color+(shown?'48':'0e');
        context.beginPath();context.moveTo(x,y);context.lineTo(sx,sy);context.stroke();
        position(star.node,sx,sy,shown?1:.14,shown);
        star.node.setAttribute('aria-pressed',String(selected===star.id));
      });
    });
    status.textContent=(active<0?'全景':groups[active].name)+' · '+Math.round(scale*100)+'%';
  }
  function redrawPanel(){
    filters.querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',String(Number(btn.dataset.cluster)===active)));
    const ids=groups.flatMap((g,i)=>active===-1||i===active?g.scenes.filter(matches):[]);
    results.innerHTML=(query||active!==-1)?(ids.map(id=>`<button type="button" class="atlas-result" data-scene="${id}" aria-pressed="${id===selected}">${rows[id][1]}</button>`).join('')||'<p class="atlas-small" role="status">没有匹配场景</p>'):'';
  }
  function center(x,y,value){
    scale=value;dx=(.5-x)*width*scale;dy=(.48-y)*height*scale;
  }
  function cluster(index){
    active=index;selected=-1;detail.hidden=true;
    if(index<0) center(.5,.48,1);
    else center(groups[index].x,groups[index].y,1.65);
    redrawPanel();draw();
  }
  function selectScene(id,focus){
    selected=id;
    const row=rows[id];
    detail.hidden=false;
    detail.innerHTML=`<button class="atlas-close" type="button" aria-label="关闭场景卡" data-close-atlas>×</button><div class="atlas-small">${row[0]} · ${id<atlasOriginalCount?'研究案例':'场景选品建议'}</div>
      <h2>${row[1]}</h2><div class="atlas-small">赠送对象 · ${row[2]}${row[3]?' / ¥'+row[3]+'/份':''}</div><p>${id<atlasOriginalCount?row[5]:row[7]}</p>
      <div class="atlas-detail-actions"><button type="button" data-id="${id}">完整场景 ↗</button><button type="button" data-atlas-save="${id}" aria-pressed="${fav.includes(id)}">${fav.includes(id)?'已收藏':'收藏'}</button></div>`;
    if(focus){
      const g=groups.find(group=>group.scenes.includes(id));
      center(g.x,g.y,1.55);
    }
    redrawPanel();draw();
  }
  function zoom(amount,x=width/2,y=height/2){
    const next=Math.max(.72,Math.min(4,scale*amount)),factor=next/scale;
    dx=(x-width/2)-(x-width/2-dx)*factor;
    dy=(y-height/2)-(y-height/2-dy)*factor;
    scale=next;draw();
  }
  search.addEventListener('input',()=>{
    query=search.value.trim().toLowerCase();
    redrawPanel();draw();
  });
  app.addEventListener('click',handleClick);
  function handleClick(event){
    const btn=event.target.closest('button');
    if(!btn || suppressClick) return;
    if(btn.dataset.cluster!==undefined) cluster(Number(btn.dataset.cluster));
    if(btn.dataset.scene!==undefined) selectScene(Number(btn.dataset.scene),!btn.classList.contains('atlas-node'));
    if(btn.dataset.move==='reset'){search.value='';query='';cluster(-1)}
    if(btn.dataset.move==='plus') zoom(1.27);
    if(btn.dataset.move==='minus') zoom(1/1.27);
    if(btn.hasAttribute('data-close-atlas')){selected=-1;detail.hidden=true;redrawPanel();draw()}
    if(btn.dataset.atlasSave!==undefined){
      const id=Number(btn.dataset.atlasSave),wasSaved=fav.includes(id);
      fav=wasSaved?fav.filter(n=>n!==id):[...fav,id];
      try{localStorage.giftFav=JSON.stringify(fav)}catch{}
      btn.textContent=wasSaved?'收藏':'已收藏';btn.setAttribute('aria-pressed',String(!wasSaved));
    }
  }
  stage.addEventListener('wheel',event=>{
    if(event.target.closest('.atlas-detail')) return;
    event.preventDefault();
    const rect=stage.getBoundingClientRect();
    zoom(Math.exp(-Math.max(-100,Math.min(100,event.deltaY))*.004),event.clientX-rect.left,event.clientY-rect.top);
  },{passive:false});
  stage.addEventListener('pointerdown',event=>{
    if(event.button!==0||event.target.closest('button,.atlas-detail')) return;
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,dx,dy};
    stage.setPointerCapture(event.pointerId);stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove',event=>{
    if(drag?.id!==event.pointerId)return;
    dx=drag.dx+event.clientX-drag.x;dy=drag.dy+event.clientY-drag.y;draw();
  });
  for(const type of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(type,()=>{
    if(!drag)return;
    suppressClick=Math.hypot(dx-drag.dx,dy-drag.dy)>4;
    drag=null;stage.classList.remove('dragging');setTimeout(()=>{suppressClick=false},0);
  });
  const observer=new ResizeObserver(()=>{
    const w=stage.clientWidth,h=stage.clientHeight;
    if(width&&height){dx*=w/width;dy*=h/height}
    width=w;height=h;ratio=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);draw();
  });
  observer.observe(stage);
  atlasCleanup=()=>{observer.disconnect();app.removeEventListener('click',handleClick)};
  redrawPanel();
}

onhashchange=route;route();
</script></body></html>
